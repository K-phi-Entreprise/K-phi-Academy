<title>K-φ Academy</title>
<script>/* dark by default; light only when the visitor chose it */try{if(localStorage.getItem("kphi-academy-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky header, then one view at a time. Lesson view = contents rail + reading column, like a ledger beside a journal. */
:root {
  --bg: #0B0F1A; --surface: #121829; --surface-2: #1A2238; --line: #27314B;
  --fg: #EDEFF5; --muted: #98A1B7; --hi: #E6FF00; --accent: #E6FF00; --accent-ink: #0B0F1A;
  --ok: #46D79A; --bad: #FF7A7A; --ok-bg: rgba(70,215,154,.12); --bad-bg: rgba(255,122,122,.12);
  --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 32px rgba(0,0,0,.35);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F3F5FA; --surface: #FFFFFF; --surface-2: #E9EDF5; --line: #D5DBE7;
  --fg: #121A2E; --muted: #56607A; --hi: #22307A; --accent: #E6FF00; --accent-ink: #121A2E;
  --ok: #11845A; --bad: #C23A3A; --ok-bg: rgba(17,132,90,.10); --bad-bg: rgba(194,58,58,.10);
  --shadow: 0 1px 2px rgba(18,26,46,.06), 0 8px 24px rgba(18,26,46,.06); color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--hi); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, summary:focus-visible, label:focus-within { outline: 2px solid var(--hi); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1160px; margin: 0 auto; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 60px; flex-wrap: wrap; }
.mark { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); }
.mark .kphi { position: relative; display: inline-block; font: 800 22px/1 Arial, Helvetica, sans-serif; letter-spacing: 1px; color: var(--hi); }
.mark .kphi::after { content: "K-φ"; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(90deg, transparent 0%, transparent 28%, #C5B358 38%, #36D6A0 47%, #534AB7 54%, #E6007E 62%, transparent 74%, transparent 100%);
  background-size: 300% 100%; background-repeat: no-repeat; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: brandSweep 2.6s linear .5s 1 both; }
.mark:hover .kphi::after { animation: brandSweepAgain 2.6s linear 0s 1 both; }
@keyframes brandSweep { 0% { opacity: 0; background-position: 160% 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; background-position: -160% 0; } }
@keyframes brandSweepAgain { 0% { opacity: 0; background-position: 160% 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; background-position: -160% 0; } }
@media (prefers-reduced-motion: reduce) { .mark .kphi::after { animation: none !important; } }
.theme-toggle { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.theme-toggle svg { width: 18px; height: 18px; }
.theme-toggle .sun { display: none; }
:root[data-theme="light"] .theme-toggle .sun { display: block; }
:root[data-theme="light"] .theme-toggle .moon { display: none; }
.mark span { font: 600 13px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.top nav { display: flex; gap: 18px; margin-left: auto; font-size: 14px; }
.top nav a { color: var(--muted); text-decoration: none; }
.top nav a[aria-current="page"], .top nav a:hover { color: var(--fg); }
.acct { display: flex; align-items: center; gap: 10px; position: relative; }
.acct .btn { padding: 8px 14px; font-size: 14px; }
.acct .who { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 4px; color: var(--fg); cursor: pointer; font: 500 14px/1 var(--f-body); }
.acct .av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 12px/1 var(--f-mono); }
.acct .menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 240px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: grid; gap: 2px; z-index: 6; }
.acct .menu .id { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.acct .menu .id b { display: block; color: var(--fg); font-size: 14px; }
.acct .menu a, .acct .menu button { text-align: left; padding: 9px 10px; border-radius: 8px; border: 0; background: none; color: var(--fg); font: 500 14px/1.2 var(--f-body); text-decoration: none; cursor: pointer; }
.acct .menu a:hover, .acct .menu button:hover { background: var(--surface-2); }
.banner { margin-bottom: 18px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
@media (max-width: 560px) { .top nav { order: 3; width: 100%; margin-left: 0; padding-bottom: 10px; } .acct { margin-left: auto; } .acct .who span.nm { display: none; } }

main { padding-block: 32px 72px; }
.eyebrow { font: 600 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 62ch; font-size: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--f-mono); padding: 5px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.live { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn { display: inline-flex; align-items: center; gap: 8px; font: 600 15px/1 var(--f-body); padding: 12px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.note { font-size: 14px; color: var(--muted); }

/* catalogue */
.hero { display: grid; gap: 18px; padding-block: 8px 28px; }
.hero h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 800; letter-spacing: -.02em; max-width: 18ch; }
.hero h1 em { font-style: normal; color: var(--hi); }
.resume { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.resume .bar { flex: 1 1 200px; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
section.block { display: grid; gap: 16px; margin-top: 44px; }
section.block > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
section.block h2 { font-size: 24px; }
.paths { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; align-items: start; }
.path { display: grid; gap: 10px; align-content: start; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.path.star { border-color: var(--hi); }
.path h3 { font-size: 19px; }
.path p { margin: 0; color: var(--muted); font-size: 14px; }
.path .seq { display: flex; flex-wrap: wrap; gap: 6px; }
.path .cred { font: 500 13px/1.3 var(--f-mono); color: var(--hi); }
.courses { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.crow { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 16px; align-items: center; padding: 16px 18px; text-decoration: none; color: inherit; border-top: 1px solid var(--line); }
.crow:first-child { border-top: 0; }
.crow:hover { background: var(--surface-2); }
.crow .code { font: 700 22px/1 var(--f-mono); color: var(--hi); }
.crow h3 { font-size: 18px; }
.crow p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; counter-reset: s; }
.steps li { list-style: none; padding: 16px; border-left: 2px solid var(--hi); background: var(--surface); border-radius: 0 12px 12px 0; }
.steps li::before { counter-increment: s; content: "0" counter(s); display: block; font: 600 12px/1 var(--f-mono); color: var(--muted); margin-bottom: 8px; }
.steps { padding: 0; margin: 0; }
.steps b { display: block; font-family: var(--f-display); font-size: 16px; margin-bottom: 4px; }
.steps span { color: var(--muted); font-size: 14px; }

/* course page */
.course-head { display: grid; gap: 14px; }
.course-head h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 800; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: var(--muted); }
.facts b { color: var(--fg); font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; margin-top: 28px; align-items: start; }
.outcomes { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.chapters { display: grid; gap: 12px; }
.chapter { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.chapter summary { display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; list-style: none; }
.chapter summary::-webkit-details-marker { display: none; }
.chapter summary .code { font: 600 14px/1 var(--f-mono); color: var(--hi); width: 30px; }
.chapter summary h3 { font-size: 17px; flex: 1; min-width: 0; }
.chapter summary .count { font: 500 13px/1 var(--f-mono); color: var(--muted); }
.lrow { display: grid; grid-template-columns: 22px 52px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; font-size: 15px; }
a.lrow:hover { background: var(--surface-2); }
.lrow .c { font: 500 13px/1 var(--f-mono); color: var(--muted); }
.lrow .m { font: 500 12px/1 var(--f-mono); color: var(--muted); }
.lrow.off { color: var(--muted); }
.tick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.tick.done { background: var(--accent); border-color: transparent; }
.tick.done::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--accent-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.side { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }
.panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 18px; display: grid; gap: 12px; }
.panel h3 { font-size: 16px; }
.panel p { margin: 0; font-size: 14px; color: var(--muted); }

/* lesson player */
.player { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 36px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 100px); overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.rail .rhead { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.rail .rhead a { font: 600 15px/1.2 var(--f-display); color: var(--fg); text-decoration: none; }
.rail .rch { padding: 10px 16px 4px; font: 600 11px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rail a.ri { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 10px; align-items: start; padding: 7px 16px; font-size: 14px; line-height: 1.35; color: var(--muted); text-decoration: none; }
.rail a.ri:hover { color: var(--fg); }
.rail a.ri[aria-current="page"] { color: var(--fg); background: var(--surface-2); box-shadow: inset 2px 0 0 var(--hi); }
.rail .tick { width: 16px; height: 16px; margin-top: 1px; }
.rail .rfoot { border-top: 1px solid var(--line); margin-top: 8px; padding: 10px 0; }
.mobile-toc { display: none; }
.lesson { display: grid; gap: 22px; max-width: 760px; min-width: 0; }
.lesson > * { min-width: 0; }
.res .chip { white-space: normal; line-height: 1.35; }
.lesson .crumb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.lesson h1 { font-size: clamp(28px, 4.4vw, 40px); font-weight: 700; letter-spacing: -.01em; }
.objective { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: baseline; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); }
.objective .eyebrow { color: var(--hi); }
.video { position: relative; display: block; width: 100%; background: #000; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 20% 10%, rgba(230,255,0,.10), transparent 55%), linear-gradient(160deg, #141C33, #0B0F1A); display: grid; place-items: center; }
.video .play { width: 64px; height: 64px; border-radius: 50%; background: #E6FF00; display: grid; place-items: center; }
.video .play::after { content: ""; border-left: 18px solid #0B0F1A; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 5px; }
.video .vlab { position: absolute; left: 16px; bottom: 14px; font: 500 13px/1 var(--f-mono); color: #C9CFDE; }
.prose { font-size: 17px; line-height: 1.7; }
.prose > * { margin: 0 0 16px; }
.prose h3 { font-size: 19px; margin-top: 8px; }
.prose ul, .prose ol { padding-left: 22px; }
.prose li { margin: 4px 0; }
.prose strong { color: var(--fg); font-weight: 600; }
.tablewrap { overflow-x: auto; }
.prose table { border-collapse: collapse; width: 100%; font-size: 15px; }
.prose th, .prose td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose th { font: 600 12px/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.try { display: grid; gap: 12px; padding: 18px; border-radius: 14px; border: 1px dashed var(--hi); }
.try .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.verify { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.verify .ask { font-weight: 600; }
.verify form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.verify input[type=text] { flex: 1 1 220px; min-width: 0; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.verify .out { margin: 0; padding: 10px 12px; border-radius: 10px; }
.verify .out.pass { color: var(--ok); background: var(--ok-bg); }
.verify .out.fail { color: var(--bad); background: var(--bad-bg); }
[data-exam-live] { display: grid; gap: 12px; align-content: start; }
[data-exam-live] .files { display: grid; gap: 8px; }
.examform { display: grid; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.examform .field { display: grid; gap: 6px; font-size: 14px; }
.examform input, .examform textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; width: 100%; box-sizing: border-box; }
[data-exam-live] .out { margin: 0; padding: 10px 12px; border-radius: 10px; }
[data-exam-live] .out.fail { color: var(--bad); background: var(--bad-bg); }
.keys { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.keys li { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 8px; }
.keys li::before { content: "→"; color: var(--hi); font-family: var(--f-mono); }
.res { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: grid; gap: 16px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.q { display: grid; gap: 10px; }
.q p { margin: 0; font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 15px; }
.opt input { accent-color: var(--hi); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.why { font-size: 14px; color: var(--muted); margin: 0; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); }
.progress-line { display: flex; align-items: center; gap: 12px; font: 500 13px/1 var(--f-mono); color: var(--muted); }
.progress-line .bar { flex: 1; }

/* exam + report */
.tasks { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.rule { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.rule b { display: block; font: 700 20px/1.1 var(--f-display); color: var(--hi); }
.rule span { font-size: 13px; color: var(--muted); }
.report { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.report .rh { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); font: 500 13px/1.4 var(--f-mono); color: var(--muted); }
.rline { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 15px; }
.rline:first-of-type { border-top: 0; }
.st { font: 600 12px/1 var(--f-mono); padding: 5px 0; text-align: center; border-radius: 6px; height: fit-content; }
.st.pass { color: var(--ok); background: var(--ok-bg); }
.st.fail { color: var(--bad); background: var(--bad-bg); }
.rline small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }

/* certificate */
.cert { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: clamp(22px, 5vw, 44px); display: grid; gap: 18px; max-width: 760px; }
.aurora { position: absolute; inset: 0 0 auto; height: 6px;
  background: linear-gradient(90deg, transparent, #C5B358, #36D6A0, #534AB7, #E6007E, transparent); background-size: 220% 100%; animation: sweep 2.4s ease-out 1 both; }
@keyframes sweep { from { background-position: 100% 0; } to { background-position: 0% 0; } }
@media (prefers-reduced-motion: reduce) { .aurora { animation: none; } }
.cert .holder { font: 800 clamp(28px, 5vw, 40px)/1.1 var(--f-display); }
.cert dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 0; }
.cert dt { font: 600 11px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.cert dd { margin: 4px 0 0; font-weight: 600; }
.valid { display: inline-flex; gap: 8px; align-items: center; font: 600 13px/1 var(--f-mono); color: var(--ok); background: var(--ok-bg); padding: 7px 10px; border-radius: 99px; width: fit-content; }
.valid::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sample { font: 600 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); padding: 6px 8px; border-radius: 6px; width: fit-content; }
.flash { font-size: 14px; color: var(--hi); }
.watch { display: flex; align-items: center; gap: 12px; margin-top: -10px; }
.watch .wbar { flex: 1; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.watch canvas { display: block; width: 100%; height: 8px; }
.watch .wtxt { font-size: 12px; color: var(--muted); white-space: nowrap; }
.watch.ok .wtxt { color: var(--ok); }
.foot { border-top: 1px solid var(--line); background: var(--surface); padding-block: 22px calc(22px + env(safe-area-inset-bottom, 0px)); }
.foot .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; font-size: 13px; color: var(--muted); }
.foot b { color: var(--hi); font: 800 14px/1 Arial, Helvetica, sans-serif; letter-spacing: 1px; }
.foot a { margin-left: auto; }

@media (max-width: 900px) {
  .two { grid-template-columns: 1fr; }
  .side { position: static; }
  .player { grid-template-columns: 1fr; gap: 18px; }
  .rail { display: none; }
  .mobile-toc { display: block; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .mobile-toc summary { padding: 12px 14px; cursor: pointer; font-weight: 600; }
  .mobile-toc .rail-in a.ri { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 10px; padding: 7px 14px; font-size: 14px; color: var(--muted); text-decoration: none; }
  .mobile-toc .rail-in a.ri[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
  .mobile-toc .rch { padding: 8px 14px 2px; font: 600 11px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .crow { grid-template-columns: 40px minmax(0,1fr); }
  .crow .chip { grid-column: 2; justify-self: start; }
  .lrow { grid-template-columns: 22px 44px minmax(0,1fr); }
  .lrow .m { display: none; }
}

<header class="top gut"><div class="wrap">

  <span>Certified builders are independent of K-φ. They hold no stake in it and receive no referral fees.</span>
  <a href="https://k-phi.com" rel="noopener">k-phi.com</a>
</div></footer>

<script>
const DATA = /*__DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slug = code => "lesson-" + code.toLowerCase().replace(/\./g, "-");
const course = id => DATA.courses.find(c => c.id === id);
const OPEN = DATA.courses.filter(c => c.status === "available");
const lessonsOf = c => c.chapters.flatMap(ch => ch.lessons.map(l => ({ ...l, ch, c })));
const ALL = OPEN.flatMap(lessonsOf);
const flat = lessonsOf(course("foundation"));

/* progress: a per-viewer convenience, kept in this browser only */
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem("kphi-academy-done") || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem("kphi-academy-done", JSON.stringify([...done])); } catch (e) {} };
const pct = (c = course("foundation")) => { const ls = lessonsOf(c); return Math.round(100 * ls.filter(l => done.has(l.code)).length / ls.length); };
const nextUp = (c = course("foundation")) => { const ls = lessonsOf(c); return ls.find(l => !done.has(l.code)) || ls[ls.length - 1]; };
const current = () => OPEN.find(c => pct(c) > 0 && pct(c) < 100) || OPEN.find(c => pct(c) < 100) || OPEN[0];
const tick = code => `<span class="tick ${done.has(code) ? "done" : ""}" aria-label="${done.has(code) ? "Completed" : "Not started"}"></span>`;

function home() {
  const cc = current(), p = pct(cc), n = nextUp(cc);
  const resume = DATA.courses.some(c => c.status === "available" && pct(c) > 0)
    ? `<div class="resume"><div><div class="eyebrow">Continue</div><b>${esc(n.code)} · ${esc(n.title)}</b></div>
        <div class="bar" aria-label="${esc(cc.title)} progress ${p}%"><i style="width:${p}%"></i></div>
        <span class="mono note">${p}% of ${esc(cc.title)}</span><a class="btn primary" href="#${slug(n.code)}">Resume</a></div>`
    : `<div class="resume"><div><div class="eyebrow">Start here</div><b>F1.1 · ${esc(flat[0].title)}</b></div>
        <span class="note">Foundation takes about two hours and is required for every other course.</span>
        <a class="btn primary" href="#${slug(flat[0].code)}">Start Foundation</a></div>`;
  const paths = DATA.paths.map(pa => `
    <article class="path ${pa.id === "consultant" ? "star" : ""}">
      <div class="eyebrow">${esc(pa.hours)}</div><h3>${esc(pa.title)}</h3><p>${esc(pa.who)}</p>
      <div class="seq">${pa.courses.map(c => `<span class="chip">${esc(course(c).code)} ${esc(course(c).title)}</span>`).join("")}</div>
      <div class="cred">${esc(pa.credential)}</div>
    </article>`).join("");
  const rows = DATA.courses.map(c => `
    <a class="crow" href="#course-${c.id}">
      <span class="code">${esc(c.code)}</span>
      <div><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p></div>
      ${c.status === "available" ? `<span class="chip live">Open · ${esc(c.duration.replace("About ", ""))}</span>` : `<span class="chip">In preparation</span>`}
    </a>`).join("");
  return `
  <div class="hero">
    <div class="eyebrow">FP&amp;A · Cash · Build</div>
    <h1>Become AI-ready in finance. <em>Certified on a live tenant.</em></h1>
    <p class="lede">Learn what AI agents can and cannot do in finance, and how to run, build and verify them on K-φ. For finance teams and the consultants who implement K-φ. Every exam is a real task on a tenant of your own, graded automatically against an independent answer key.</p>
    ${resume}
  </div>
  <section class="block"><header><h2>Paths</h2><span class="note">Each path ends with a credential.</span></header><div class="paths">${paths}</div></section>
  <section class="block"><header><h2>Courses</h2><span class="note">Open for the pilot: ${OPEN.map(c => esc(c.title)).join(", ")}. The others follow.</span></header><div class="courses">${rows}</div></section>
  <section class="block"><header><h2>How certification works</h2></header>
    <ol class="steps">
      <li><b>Learn</b><span>Short lessons on K-φ and on working with AI agents, each with a short captioned video and one thing to try in K-φ.</span></li>
      <li><b>Practise</b><span>Sign in and you get your own practice company, a copy of Halden Trading: three companies, two years of books, six bank accounts. Try each step there.</span></li>
      <li><b>Take the exam</b><span>A fresh tenant, a brief, any tools you like, including any LLM. 72 hours.</span></li>
      <li><b>Get verified</b><span>The checker grades what is in the tenant. Pass, and your certificate gets a public verify page.</span></li>
    </ol>
  </section>`;
}

function courseView(id) {
  const c = course(id);
  if (!c) return home();
  const open = c.status === "available";
  const chapters = c.chapters.map((ch, i) => `
    <details class="chapter" ${i === 0 || !open ? "open" : ""}>
      <summary><span class="code">${esc(ch.code)}</span><h3>${esc(ch.title)}</h3><span class="count">${ch.lessons.length} lessons</span></summary>
      ${ch.lessons.map(l => open
        ? `<a class="lrow" href="#${slug(l.code)}">${tick(l.code)}<span class="c">${esc(l.code)}</span><span>${esc(l.title)}</span><span class="m">${l.minutes} min</span></a>`
        : `<div class="lrow off"><span class="tick"></span><span class="c">${esc(l.code)}</span><span>${esc(l.title)}</span><span class="m">soon</span></div>`).join("")}
      ${open && ch.check ? `<div class="lrow off"><span></span><span class="c">✓</span><span>Self-check, ${ch.check.length} questions</span><span class="m">ungraded</span></div>` : ""}
    </details>`).join("");
  const n = open ? nextUp(c) : null, p = open ? pct(c) : 0;
  return `
  <div class="course-head">
    <div class="crumb note"><a href="#home">Catalogue</a> / Course ${esc(c.code)}</div>
    <h1>${esc(c.title)}</h1>
    <p class="lede">${esc(c.summary)}</p>
    <div class="facts"><span><b>${esc(c.duration)}</b></span><span>For: <b>${esc(c.audience)}</b></span><span>Prerequisite: <b>${esc(c.prereq)}</b></span><span>Badge: <b>${esc(c.badge)}</b></span></div>
  </div>
  <div class="two">
    <div class="chapters">
      ${c.outcomes ? `<div class="panel"><h3>You will be able to</h3><ul class="outcomes">${c.outcomes.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>` : ""}
      ${chapters}
    </div>
    <aside class="side">
      ${open ? `<div class="panel"><h3>Your progress</h3><div class="bar"><i style="width:${p}%"></i></div><p class="mono">${p}% · next: ${esc(n.code)}</p><a class="btn primary" href="#${slug(n.code)}">${p ? "Resume" : "Start course"}</a></div>
      <div class="panel"><h3>Practise</h3><p>${esc(c.lab)}</p>${practiceLink("practice")}</div>
      <div class="panel"><h3>Exam</h3><p>One task on a fresh tenant, graded by the checker. Three attempts, 24 hours apart.</p><a class="btn" href="#exam-${c.id}">See the exam</a></div>`
      : `<div class="panel"><h3>In preparation</h3><p>The chapters are set; lessons are being written and recorded. Foundation is open now and is the prerequisite.</p><a class="btn primary" href="#course-foundation">Go to Foundation</a></div>`}
    </aside>
  </div>`;
}

function railItems(c) {
  return c.chapters.map(ch => `<div class="rch">${esc(ch.code)} · ${esc(ch.title)}</div>` +
    ch.lessons.map(l => `<a class="ri" href="#${slug(l.code)}" data-code="${esc(l.code)}">${tick(l.code)}<span><span class="mono">${esc(l.code)}</span> ${esc(l.title)}</span></a>`).join("")).join("") +
    `<div class="rfoot"><a class="ri" href="#exam-${c.id}"><span class="tick"></span><span>${esc(c.exam.title)}</span></a></div>`;
}

/* Practice happens in K-φ itself: each signed-in learner has their own practice company,
   a copy of Halden Trading (K-phi-engine, blocks/academy/practice.js); AI lessons use the
   learner's own K-φ account. */
function practiceLink(kind) {
  const host = (SESSION && SESSION.api) || apiBase() || AUTH_HOSTS.prod;
  if (kind === "account") return `<div class="row"><a class="btn" href="${esc(host)}/app" target="_blank" rel="noopener">Open K-φ</a><span class="note">${SESSION ? "Your account opens in a new tab." : "Sign in first (top right) to get your account."}</span></div>`;
  if (!SESSION) return `<div class="row"><a class="btn" href="${esc(host)}/academy/signin">Sign in to practise</a><span class="note">Signing in gives you your own practice company, a copy of Halden Trading.</span></div>`;
  return `<div class="row"><button class="btn" type="button" data-practice>Open my practice company</button><span class="note">Your own copy of Halden Trading, in a new tab. That tab is signed into the practice company; sign in again there to get back to your own K-φ account.</span></div>`;
}

/* Open (and, the first time, create) the learner's practice company. The tab is opened
   inside the click so no pop-up blocker stops it, then sent to the one-time link. */
async function openPractice(btn) {
  if (!SESSION) return;
  const w = window.open("", "_blank");
  if (w) { try { w.document.title = "K-φ practice company"; w.document.body.innerHTML = '<p style="font:16px system-ui;padding:40px">Preparing your practice company…</p>'; } catch (e) { /* cross-origin later */ } }
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Preparing…";
  try {
    const r = await fetch(SESSION.api + "/api/academy/practice", { method: "POST", headers: { Authorization: "Bearer " + SESSION.token, "Content-Type": "application/json", "X-Requested-With": "XMLHttpRequest" }, body: "{}" });
    if (r.status === 404) {
      /* this K-φ server does not have practice companies yet: the demo instead */
      if (w) w.location = SESSION.api + "/login"; else window.open(SESSION.api + "/login", "_blank");
      FLASH = "Practice companies are not on this K-φ server yet, so the demo opened instead: choose Continue in Demo Mode. Nothing you do there is saved.";
      return;
    }
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { SESSION = null; store.set("kphi-academy-session", null); if (w) w.close(); FLASH = "Your academy session ended. Sign in again."; return; }
    if (!r.ok || !d.open_url) { if (w) w.close(); FLASH = d.error || "Your practice company could not be opened. Try again in a minute."; return; }
    if (w) { w.opener = null; w.location = d.open_url; } else location.href = d.open_url;
  } catch (e) { if (w) w.close(); FLASH = "Could not reach K-φ. Check your connection and try again."; }
  finally { btn.disabled = false; btn.textContent = label; if (FLASH) render(); }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-practice]"); if (b) openPractice(b); });

function lessonView(code) {
  const hit = ALL.find(l => l.code === code);
  if (!hit) return courseView("foundation");
  const c = hit.c, ls = lessonsOf(c), i = ls.findIndex(l => l.code === code);
  const l = ls[i], prev = ls[i - 1], next = ls[i + 1];
  const last = l.ch.lessons[l.ch.lessons.length - 1].code === l.code;
  const check = last && l.ch.check ? `
    <section class="check" aria-label="Chapter self-check">
      <div><div class="eyebrow">Self-check · ${esc(l.ch.code)} · ungraded</div><h3 style="margin-top:6px">Before you move on</h3></div>
      ${l.ch.check.map((q, qi) => `<div class="q" data-q="${qi}"><p>${qi + 1}. ${esc(q.q)}</p><div class="opts">${q.options.map((o, oi) =>
        `<label class="opt" for="q-${esc(l.ch.code)}-${qi}-${oi}"><input type="radio" id="q-${esc(l.ch.code)}-${qi}-${oi}" name="q-${esc(l.ch.code)}-${qi}" value="${oi}"> ${esc(o)}</label>`).join("")}</div>
        <p class="why" hidden></p></div>`).join("")}
    </section>` : "";
  const p = pct(c);
  return `
  <div class="player">
    <nav class="rail" aria-label="Course contents"><div class="rhead"><a href="#course-${c.id}">${esc(c.title)}</a><div class="bar"><i style="width:${p}%"></i></div><span class="mono note">${p}% complete</span></div>${railItems(c)}</nav>
    <article class="lesson">
      <details class="mobile-toc"><summary>Course contents · ${p}%</summary><div class="rail-in">${railItems(c)}</div></details>
      <div class="crumb"><a href="#course-${c.id}">${esc(c.title)}</a> / ${esc(l.ch.code)} ${esc(l.ch.title)} <span class="chip">${esc(l.code)}</span><span class="chip">${l.minutes} min</span></div>
      <h1>${esc(l.title)}</h1>
      <div class="objective"><span class="eyebrow">Objective</span><span>${esc(l.objective)}</span></div>
      ${l.video ? `<video class="video" controls playsinline preload="metadata" src="${esc(l.video)}"${l.poster ? ` poster="${esc(l.poster)}"` : ""}>${l.captions ? `<track kind="captions" srclang="en" label="English" src="${esc(l.captions)}">` : ""}</video>
        <div class="watch" data-watch="${esc(l.code)}"><div class="wbar"><canvas width="760" height="8" aria-hidden="true"></canvas></div><span class="wtxt mono">Watched 0%</span></div>` : ""}
      <div class="prose">${l.read.replace(/<table>/g, '<div class="tablewrap"><table>').replace(/<\/table>/g, "</table></div>")}</div>
      <section class="try"><div class="eyebrow">Try it</div><div>${esc(l.try)}</div>
        ${/\bIn your practice company\b/.test(l.try) ? practiceLink("practice") : /K-φ account/.test(l.try) ? practiceLink("account") : ""}${verifyBox(l)}</section>
      <section><div class="eyebrow" style="margin-bottom:10px">Key points</div><ul class="keys">${l.points.map(k => `<li>${esc(k)}</li>`).join("")}</ul></section>
      ${l.resources ? `<section><div class="eyebrow" style="margin-bottom:10px">Resources</div><div class="res">${l.resources.map(r => `<span class="chip">${esc(r)} · pilot</span>`).join("")}</div></section>` : ""}
      ${check}
      <div class="pager">
        ${prev ? `<a class="btn" href="#${slug(prev.code)}">← ${esc(prev.code)}</a>` : `<a class="btn" href="#course-${c.id}">← Course</a>`}
        <button class="btn primary" data-complete="${esc(l.code)}" data-next="${next ? slug(next.code) : "exam-" + c.id}" ${gateOpen(l) ? "" : "disabled"}>${done.has(l.code) ? "Completed · next" : gateOpen(l) ? "Mark complete · next" : gateLabel(l)} →</button>
      </div>
    </article>
  </div>`;
}

function examView(id) {
  const c = course(id);
  if (!c || !c.exam) return courseView(id);
  const e = c.exam;
  const TRAP = { foundation: "One problem is planted in the data. Finding it is part of the exam.", fpa: "One problem is planted in the data. Finding it is part of the exam.",
    cash: "The trap: movements that look like payroll or payments but are transfers between the group's own accounts.", ai: "The trap: an assistant that gets the sign of a change wrong. Check every figure." };
  return `
  <div class="course-head">
    <div class="crumb note"><a href="#home">Catalogue</a> / <a href="#course-${c.id}">${esc(c.title)}</a> / Exam</div>
    <h1>${esc(e.title)}</h1>
    <p class="lede">${esc(e.situation)}</p>
  </div>
  <div class="two">
    <div class="chapters">
      <div class="panel"><h3>Your task</h3><ol class="tasks">${e.tasks.map(t => `<li>${esc(t)}</li>`).join("")}</ol></div>
      <div class="panel"><h3>What the checker verifies</h3><ul class="outcomes">${e.checks.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
        <p>${esc(TRAP[c.id] || "")}</p></div>
      <div data-exam-report>${exampleReport(c)}</div>
    </div>
    <aside class="side">
      <div class="rules">
        <div class="rule"><b>72 h</b><span>your exam company stays open</span></div>
        <div class="rule"><b>3</b><span>attempts, 24 h apart</span></div>
        <div class="rule"><b>Any LLM</b><span>only the result is graded</span></div>
      </div>
      <div class="panel" data-exam-live="${esc(c.id)}"><h3>Your exam</h3><p class="note">Loading…</p></div>
    </aside>
  </div>`;
}

function reportHtml(rows, head) {
  return `<div class="report"><div class="rh">${head}</div>${rows.map(r => `<div class="rline"><span class="st ${r.ok ? "pass" : "fail"}">${r.ok ? "PASS" : "FAIL"}</span><div>${esc(r.label)}<small>${esc(r.detail)}</small></div></div>`).join("")}</div>`;
}
function exampleReport(c) {
  const e = c.exam, rows = e.report.map(([st, t, d]) => ({ ok: st === "pass", label: t, detail: d }));
  return `<section class="block" style="margin-top:12px"><header><h2>What your report looks like</h2><span class="sample">Example, failed attempt</span></header>
    ${reportHtml(rows, `<span>Attempt 1 of 3 · ${esc(c.title)}</span><span>${rows.filter(r => r.ok).length} of ${rows.length} checks passed · next attempt in 24 h</span>`)}</section>`;
}

/* ── Exams (K-phi-engine, blocks/academy/exams.js) ───────────────────────
   Start creates a fresh exam company with this attempt's own variant of Halden
   Trading and one planted problem; Submit runs the checker on the company and
   the form, and the report comes back line by line. */
const EXAMSTATE = {};
const when = (iso) => { try { return new Date(String(iso).replace(" ", "T") + (/Z$|[+-]\d\d:?\d\d$/.test(iso) ? "" : "Z")).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return iso; } };
async function loadExam(id) {
  const box = $(`[data-exam-live="${id}"]`); if (!box) return;
  const api = (SESSION && SESSION.api) || apiBase() || AUTH_HOSTS.prod;
  let d = null, status = 0;
  try { const r = await fetch(api + "/api/academy/exam/" + id, { headers: SESSION ? { Authorization: "Bearer " + SESSION.token } : {} }); status = r.status; d = r.ok ? await r.json() : null; } catch (e) { status = -1; }
  EXAMSTATE[id] = d;
  drawExam(id, status);
}
function drawExam(id, status) {
  const box = $(`[data-exam-live="${id}"]`); if (!box) return;
  const d = EXAMSTATE[id], c = course(id);
  if (!d) { box.innerHTML = `<h3>Your exam</h3><p>${status === 404 ? "Exams open with the next K-φ release." : "Could not reach K-φ. Reload the page to try again."}</p>`; return; }
  if (!SESSION) { box.innerHTML = `<h3>Ready?</h3><p>Sign in to take the exam: you get a fresh company of your own for each attempt.</p><a class="btn primary" href="${esc(apiBase() || AUTH_HOSTS.prod)}/academy/signin">Sign in</a>`; return; }
  const st = d.state, last = st.attempts[st.attempts.length - 1];
  const rep = $("[data-exam-report]");
  if (rep && last && last.report) rep.innerHTML = `<section class="block" style="margin-top:12px"><header><h2>Your report</h2></header>${reportHtml(last.report, `<span>Attempt ${last.attempt} of ${st.max} · ${esc(c.title)}</span><span>${last.report.filter(r => r.ok).length} of ${last.report.length} checks passed${last.passed ? " · passed" : st.next_at ? " · next attempt " + esc(when(st.next_at)) : ""}</span>`)}</section>`;
  if (st.passed) { box.innerHTML = `<h3>Passed</h3><p>You passed this exam on attempt ${last.attempt}.</p>`; return; }
  if (st.open) {
    const files = d.exam.files.map(f => `<button class="btn" type="button" data-examfile="${esc(id)}|${esc(f)}">Download ${esc(f)}</button>`).join("");
    const fields = d.exam.form.map(f => `<label class="field"><span>${esc(f.label)}</span>${f.type === "text" ? `<textarea name="${esc(f.id)}" rows="5"></textarea>` : `<input type="text" name="${esc(f.id)}" autocomplete="off" inputmode="${f.unit ? "decimal" : "text"}">`}</label>`).join("");
    box.innerHTML = `<h3>Attempt ${st.open.attempt} of ${st.max}</h3><p class="note">Your exam company is open until ${esc(when(st.open.expires_at))}.</p>
      <button class="btn primary" type="button" data-examopen="${esc(id)}">Open my exam company</button>
      ${files ? `<div class="files">${files}</div>` : ""}
      <form class="examform" data-examsubmit="${esc(id)}"><h3>Submit</h3>${fields}<button class="btn primary" type="submit">Submit for checking</button><p class="note">Submitting closes the attempt: the checker reads your company and this form.</p></form>
      <p class="out" role="status" hidden></p>`;
    return;
  }

/* ── Watching the lesson video ─────────────────────────────────────────────
   "Mark complete" opens once 90% of the video has actually been played. The
   browser's own record of played ranges is used, so skipping ahead does not
   count; ranges add up across visits. The video pauses when the tab is hidden,
   speed is capped at 2x, and the chapter's self-check must be answered. */
const NEED = 0.9;
let WATCH = {};
try { WATCH = JSON.parse(localStorage.getItem("kphi-academy-watch") || "{}"); } catch (e) { WATCH = {}; }
const saveWatch = () => { try { localStorage.setItem("kphi-academy-watch", JSON.stringify(WATCH)); } catch (e) {} };
function mergeRanges(rs) {
  rs = rs.filter(r => r[1] > r[0]).sort((a, b) => a[0] - b[0]); const out = [];
  for (const r of rs) { const last = out[out.length - 1]; if (last && r[0] <= last[1] + 0.25) last[1] = Math.max(last[1], r[1]); else out.push([r[0], r[1]]); }
  return out;
}
const coverage = (code) => { const w = WATCH[code]; if (!w || !w.dur) return 0; return Math.min(1, w.ranges.reduce((s, r) => s + (r[1] - r[0]), 0) / w.dur); };
const lessonByCode = (code) => ALL.find(x => x.code === code);
function checkAnswered(l) {
  const lastOfCh = l.ch.lessons[l.ch.lessons.length - 1].code === l.code;
  if (!lastOfCh || !l.ch.check) return true;
  const a = (WATCH._checks || {})[l.ch.code] || [];
  return l.ch.check.every((_, i) => a.includes(i));
}
function gateOpen(l) { return done.has(l.code) || ((!l.video || coverage(l.code) >= NEED) && checkAnswered(l) && practicePassed(l)); }
function gateLabel(l) {
  if (l.video && coverage(l.code) < NEED) return `Watch the video to continue · ${Math.round(coverage(l.code) * 100)}%`;
  if (!practicePassed(l)) return "Pass the check in Try it to continue";
  return "Answer the self-check to continue";
}
function refreshGate(code) {
  const l = lessonByCode(code), b = $(`[data-complete="${code}"]`); if (!l || !b) return;
  const open = gateOpen(l); b.disabled = !open;
  b.textContent = (done.has(code) ? "Completed · next" : open ? "Mark complete · next" : gateLabel(l)) + " →";
}
function drawWatch(code) {
  const box = $(`[data-watch="${code}"]`); if (!box) return;
  const w = WATCH[code] || { ranges: [], dur: 0 }, cv = box.querySelector("canvas"), g = cv.getContext("2d");
  g.clearRect(0, 0, cv.width, cv.height);
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#E6FF00";
  if (w.dur) for (const r of w.ranges) g.fillRect(cv.width * r[0] / w.dur, 0, Math.max(1, cv.width * (r[1] - r[0]) / w.dur), cv.height);
  const pc = Math.round(coverage(code) * 100);
  box.querySelector(".wtxt").textContent = done.has(code) || pc >= NEED * 100 ? `Watched ${pc}% · done` : `Watched ${pc}% · ${Math.round(NEED * 100)}% needed`;
  box.classList.toggle("ok", done.has(code) || pc >= NEED * 100);
}
function setupWatch() {
  const v = $("video.video"), box = $("[data-watch]"); if (!v || !box) return;
  const code = box.dataset.watch;
  const record = () => {
    if (!v.duration || !isFinite(v.duration)) return;
    const w = WATCH[code] || { ranges: [], dur: v.duration }; w.dur = v.duration;
    const now = []; for (let i = 0; i < v.played.length; i++) now.push([v.played.start(i), v.played.end(i)]);
    w.ranges = mergeRanges(w.ranges.concat(now)); WATCH[code] = w; saveWatch(); drawWatch(code); refreshGate(code);
  };
  v.addEventListener("timeupdate", record); v.addEventListener("pause", record); v.addEventListener("ended", record); v.addEventListener("loadedmetadata", () => { drawWatch(code); });
  v.addEventListener("ratechange", () => { if (v.playbackRate > 2) v.playbackRate = 2; });
  drawWatch(code);
}
document.addEventListener("visibilitychange", () => { if (document.hidden) { const v = $("video.video"); if (v && !v.paused) v.pause(); } });

/* ── Check my work (K-phi-engine, blocks/academy/checks.js) ──────────────
   The engine says which lessons have a check and what to type; it runs the
   check on the learner's practice company and keeps the passes. A lesson with
   a check completes only once it passed. No catalogue (offline, or a K-φ
   server without checks yet): nothing is gated on it. */
let CHECKCAT = null, PASSED = {};
function practicePassed(l) { return !CHECKCAT || !CHECKCAT[l.code] || !!PASSED[l.code]; }
async function loadChecks() {
  const api = (SESSION && SESSION.api) || apiBase() || AUTH_HOSTS.prod;
  try {
    const r = await fetch(api + "/api/academy/checks", { headers: SESSION ? { Authorization: "Bearer " + SESSION.token } : {} });
    if (!r.ok) { CHECKCAT = null; return; }
    const d = await r.json(); CHECKCAT = d.checks || null; PASSED = d.passed || {};
  } catch (e) { CHECKCAT = null; }
}
function verifyBox(l) {
  const c = CHECKCAT && CHECKCAT[l.code]; if (!c) return "";
  const passed = PASSED[l.code];
  const head = `<div class="eyebrow">Check my work${passed ? " · passed" : ""}</div>`;
  if (!SESSION) return `<div class="verify">${head}<p class="note">Sign in (top right) to have K-φ check this step in your practice company.</p></div>`;
  const file = c.file ? `<div class="row"><button class="btn" type="button" data-file="${esc(c.file)}">Download ${esc(c.file)}</button><span class="note">Your own variant of the file: import it in your practice company.</span></div>` : "";
  const input = c.kind === "answer" ? `<input type="text" name="answer" autocomplete="off" inputmode="${c.unit ? "decimal" : "text"}" placeholder="${c.unit ? "Amount in " + esc(c.unit) : "Your answer"}" aria-label="${esc(c.prompt)}">` : "";
  return `<div class="verify" data-verify="${esc(l.code)}">${head}${file}<div class="ask">${esc(c.prompt)}</div>
    <form data-checkform="${esc(l.code)}">${input}<button class="btn primary" type="submit">${c.kind === "answer" ? "Check" : "Check my company"}</button></form>
    ${passed ? `<p class="out pass" role="status">Passed. K-φ checked this step in your practice company.</p>` : `<p class="out" role="status" hidden></p>`}</div>`;
}
document.addEventListener("submit", async e => {

/* ── Sign in with a K-φ account (K-phi-engine, blocks/academy) ──────────────
   The academy is static; sign-in happens on K-φ, which sends the person back
   with a 2-minute code in the fragment (#signin-<code>). The code becomes an
   academy key, kept in this browser. Until the production app serves the
   academy routes, sign-in shows only when a K-φ host is chosen: ?api=staging. */
const AUTH_HOSTS = { prod: "https://k-phi.com", staging: "https://staging.k-phi.com", us: "https://us.k-phi.com", eu: "https://eu.k-phi.com" };
const DEFAULT_API = AUTH_HOSTS.prod; /* production serves /academy/signin since 11 Nov 2026 (PR #263) */
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
(function pickHost() {
  const m = /[?&]api=([a-z]+)/.exec(location.search || "");
  if (!m) return;
  if (m[1] === "off") store.set("kphi-academy-api", null);
  else if (AUTH_HOSTS[m[1]]) store.set("kphi-academy-api", AUTH_HOSTS[m[1]]);
  try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
})();
const apiBase = () => { const v = store.get("kphi-academy-api"); return Object.values(AUTH_HOSTS).includes(v) ? v : DEFAULT_API; };
let SESSION = null;
try { SESSION = JSON.parse(store.get("kphi-academy-session") || "null"); } catch (e) { SESSION = null; }
if (SESSION && (!SESSION.token || !SESSION.api || Date.parse(SESSION.expires_at || 0) < Date.now())) { SESSION = null; store.set("kphi-academy-session", null); }
let FLASH = "";

function drawAccount() {
  const el = $("#acct"), api = apiBase();
  if (!SESSION && !api) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  if (!SESSION) {
    el.innerHTML = `<a class="btn" href="${esc(api)}/academy/signin">Sign in</a><a class="btn primary" href="${esc(api)}/academy/signup">Sign up</a>`;
    return;
  }
  const u = SESSION.user || {}, ini = (u.email || "?").slice(0, 2).toUpperCase();
  el.innerHTML = `<button class="who" type="button" aria-haspopup="true" aria-expanded="false" data-acct><span class="av" aria-hidden="true">${esc(ini)}</span><span class="nm">${esc(u.email || "Account")}</span></button>
    <div class="menu" role="menu" hidden>
      <div class="id"><b>${esc(u.email || "")}</b>${esc(u.company || "")}</div>
      <a role="menuitem" href="#course-${current().id}">My learning</a>
      <a role="menuitem" href="${esc(SESSION.api)}/app" rel="noopener">Open K-φ</a>
      <button role="menuitem" type="button" data-signout>Sign out</button>
    </div>`;
}

async function finishSignIn(code) {
  const api = apiBase() || AUTH_HOSTS.prod;
  try {
    const r = await fetch(api + "/api/academy/session", { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "XMLHttpRequest" }, body: JSON.stringify({ code }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.token) { FLASH = d.error || "Sign-in did not complete. Try again."; return; }
    SESSION = { token: d.token, expires_at: d.expires_at, user: d.user, api };
    store.set("kphi-academy-session", JSON.stringify(SESSION));
    FLASH = "Signed in as " + (d.user && d.user.email || "you") + ".";
  } catch (e) { FLASH = "Could not reach K-φ to finish signing in. Check your connection and try again."; }

async function checkSession() {
  if (!SESSION) return;
  try {
    const r = await fetch(SESSION.api + "/api/academy/me", { headers: { Authorization: "Bearer " + SESSION.token } });
    if (r.status === 401) { SESSION = null; store.set("kphi-academy-session", null); FLASH = "Your academy session ended. Sign in again."; render(); return; }
    const d = await r.json().catch(() => null);
    if (d && d.user) { SESSION.user = d.user; store.set("kphi-academy-session", JSON.stringify(SESSION)); drawAccount(); }
  } catch (e) { /* offline: keep the session, try again next visit */ }

async function boot() {
  if (location.hash === "#practice-expired") {
    FLASH = "That practice link has expired or was already used. Click Open my practice company again.";
    try { history.replaceState(null, "", location.pathname + "#home"); } catch (e) { location.hash = "home"; }
  }
  const m = /^#signin-(.+)$/.exec(location.hash || "");
  if (m) {

  }

  await loadChecks();
  const h = location.hash || "";
  if (CHECKCAT && h.startsWith("#lesson-") && CHECKCAT[h.slice(8).toUpperCase().replace(/-/, ".")]) render();
}
boot();
